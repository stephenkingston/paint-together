name: Release

# Pushing a tag like v0.1.0 tests, builds and publishes a release with the Linux
# binary. Running it by hand builds the package as a downloadable artifact instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    # An older Ubuntu, so the binary needs an older glibc and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install fonts (the text tests draw with a system font)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          NAME="paint-${VERSION}-linux-x86_64"
          mkdir -p "dist/$NAME"
          strip -o "dist/$NAME/paint" target/release/paint
          ./target/release/paint --export-icon "dist/$NAME/paint.png" 256
          cp packaging/linux/paint.desktop packaging/linux/install.sh "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -la dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "Paint $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md

      - name: Upload package (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: paint-linux-x86_64
          path: dist/
