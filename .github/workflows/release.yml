name: Release

# Pushing a tag like v0.2.0 tests and builds Paint for Linux, macOS and Windows,
# then publishes a release with all three. Running it by hand builds the same
# packages as downloadable artifacts, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    # An older Ubuntu, so the binary needs an older glibc and runs on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install fonts (the text tests draw with a system font)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          NAME="paint-${VERSION}-linux-x86_64"
          mkdir -p "dist/$NAME"
          strip -o "dist/$NAME/paint" target/release/paint
          ./target/release/paint --export-icon "dist/$NAME/paint.png" 256
          cp packaging/linux/paint.desktop packaging/linux/install.sh "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: paint-linux
          path: dist/*.tar.gz*

  macos:
    name: macOS (Apple Silicon and Intel)
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable

      - name: Test
        run: cargo test --release --locked

      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package Paint.app
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          NAME="paint-${VERSION}-macos-universal"
          # One binary that runs natively on both kinds of Mac.
          lipo -create -output target/release/paint \
            target/aarch64-apple-darwin/release/paint target/x86_64-apple-darwin/release/paint
          PAINT_BIN=target/release/paint ./bundle-macos.sh
          # Not notarized: an ad-hoc signature, so macOS asks once before opening it.
          codesign --force --deep --sign - target/release/Paint.app
          mkdir -p dist
          ditto -c -k --keepParent target/release/Paint.app "dist/$NAME.zip"
          (cd dist && shasum -a 256 "$NAME.zip" > "$NAME.zip.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: paint-macos
          path: dist/*.zip*

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    env:
      # Link the C runtime in, so no Visual C++ redistributable is needed.
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          case "$VERSION" in v*) ;; *) VERSION=dev ;; esac
          NAME="paint-${VERSION}-windows-x86_64"
          mkdir -p "dist/$NAME"
          cp target/release/paint.exe "dist/$NAME/"
          (cd dist && 7z a -tzip "$NAME.zip" "$NAME" > /dev/null && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: paint-windows
          path: dist/*.zip*

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: paint-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Paint Together $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
