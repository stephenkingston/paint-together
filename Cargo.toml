[package]
name = "paint-together"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Classic Windows Paint, rebuilt in Rust, where kids on the same Wi-Fi draw on one picture together in real time"
license = "MIT"
repository = "https://github.com/stephenkingston/paint-together"
readme = "README.md"
keywords = ["paint", "drawing", "collaborative", "kids", "egui"]
categories = ["graphics", "multimedia::images"]
# What goes to crates.io: the code, not the screenshots or release tooling.
include = ["/src", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

# The installed command is `paint`.
[[bin]]
name = "paint"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
arboard = "3.6"
bincode = "2"
egui = "0.36"
# The window and its input (winit), with copy and paste, links and screen readers
egui-winit = { version = "0.36", features = ["accesskit"] }
# Puts the pixels the app draws (on the CPU, src/soft.rs) in the window
softbuffer = "0.4"
flate2 = "1"
mdns-sd = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp", "ico"] }
rfd = "0.17"

# The Dock icon when Paint isn't run from its app bundle
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSGraphics", "NSImage", "NSImageRep", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

# Windows names its font files briefly (arialbd.ttf), so the Text tool reads
# each font's own name table there.
[target.'cfg(windows)'.dependencies]
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

# Pixel loops are painfully slow unoptimized, even in debug builds.
[profile.dev.package."*"]
opt-level = 3
